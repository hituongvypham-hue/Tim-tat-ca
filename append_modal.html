<!-- API Key Modal -->
<div class="modal" id="apiKeyModal">
    <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">
            <h3>🔑 Gemini API Key</h3>
            <button class="modal-close" onclick="closeApiKeyModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label" style="display:block; margin-bottom:8px; font-weight:500;">API Key</label>
                <input type="password" class="form-input" id="geminiApiKeyInput"
                    placeholder="Paste your Gemini API Key here..."
                    style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--mac-border); background: var(--mac-input-bg); color: var(--mac-text);">
                <div style="font-size: 12px; color: var(--mac-text-secondary); margin-top: 4px;">
                    Key is stored locally in your browser.
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeApiKeyModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveGeminiApiKey()">Save Key</button>
        </div>
    </div>
</div>

<script>
    // API Key Logic
    function showApiKeyModal() {
        const key = localStorage.getItem('geminiApiKey');
        if (key) {
            const input = document.getElementById('geminiApiKeyInput');
            if (input) input.value = key;
        }
        const modal = document.getElementById('apiKeyModal');
        if (modal) modal.classList.add('active');
    }

    function closeApiKeyModal() {
        const modal = document.getElementById('apiKeyModal');
        if (modal) modal.classList.remove('active');
    }

    function saveGeminiApiKey() {
        const input = document.getElementById('geminiApiKeyInput');
        if (!input) return;

        const key = input.value.trim();
        if (key) {
            localStorage.setItem('geminiApiKey', key);
            updateApiStatus();
            closeApiKeyModal();
            if (typeof toast === 'function') toast('✅ API Key saved!');
        } else {
            localStorage.removeItem('geminiApiKey');
            updateApiStatus();
            closeApiKeyModal();
            if (typeof toast === 'function') toast('🗑️ API Key removed');
        }
    }

    function updateApiStatus() {
        const key = localStorage.getItem('geminiApiKey');
        const badge = document.getElementById('apiStatusBadge');
        if (badge) {
            if (key) {
                badge.classList.remove('disconnected');
                badge.classList.add('connected');
                const icon = badge.querySelector('.status-icon');
                if (icon) icon.textContent = '✅';
            } else {
                badge.classList.remove('connected');
                badge.classList.add('disconnected');
                const icon = badge.querySelector('.status-icon');
                if (icon) icon.textContent = '❌';
            }
        }
    }

    // Clock / Version
    function updateHeaderClock() {
        const clock = document.getElementById('headerClock');
        if (clock) {
            // Formatting based on user request: vYYYY.MM.DD HH:MM
            const now = new Date();
            const version = `v2026.01.19 15:00`;
            clock.textContent = version;
        }
    }

    // Init immediately
    updateApiStatus();
    updateHeaderClock();

    // And on load ensure it runs
    document.addEventListener('DOMContentLoaded', () => {
        updateApiStatus();
        updateHeaderClock();
    });
</script>
