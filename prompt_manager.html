<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📁 Prompt Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Mammoth.js for DOCX import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f3f3f3;
            --sidebar: #ffffff;
            --item: #ffffff;
            --item-hover: #e5e5e5;
            --item-selected: #cce8ff;
            --border: #e0e0e0;
            --text: #1a1a1a;
            --text-muted: #666666;
            --accent: #0078d4;
            --folder: #dcb67a;
            --file: #519aba;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            font-size: 13px;
        }

        /* Sidebar - Folder Tree */
        .sidebar {
            width: 250px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            /* Prevent shrinking */
        }

        .resizer {
            width: 5px;
            background: transparent;
            cursor: col-resize;
            border-right: 1px solid transparent;
            transition: background 0.2s;
            z-index: 10;
            margin-left: -2px;
            /* Overlap border */
        }

        .resizer:hover,
        .resizer.resizing {
            background: var(--accent);
            opacity: 0.5;
        }

        .sidebar-header {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
        }

        .sidebar-header button:hover {
            color: var(--text);
        }

        .folder-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .folder-item,
        .prompt-item {
            display: flex;
            align-items: center;
            padding: 6px 16px;
            cursor: pointer;
            user-select: none;
        }

        .folder-item:hover,
        .prompt-item:hover {
            background: var(--item-hover);
        }

        .folder-item.selected,
        .prompt-item.selected {
            background: var(--item-selected);
        }

        .folder-item.drag-over {
            background: var(--accent);
        }

        .folder-icon,
        .prompt-icon {
            margin-right: 8px;
            font-size: 14px;
        }

        .folder-icon {
            color: var(--folder);
        }

        .prompt-icon {
            color: var(--file);
        }

        .folder-name,
        .prompt-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .folder-children {
            padding-left: 16px;
        }

        .folder-children.collapsed {
            display: none;
        }

        .folder-toggle {
            width: 16px;
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            padding: 8px 16px;
            background: var(--sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .toolbar button {
            padding: 6px 12px;
            background: var(--item);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar button:hover {
            background: var(--item-hover);
        }

        .content {
            flex: 1;
            display: flex;
        }

        /* Prompt Content */
        .prompt-view {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .prompt-view.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .prompt-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .prompt-content {
            background: var(--item);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            white-space: pre-wrap;
            line-height: 1.6;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }

        .copy-btn {
            padding: 8px 16px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .copy-btn:hover {
            opacity: 0.9;
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 500px;
            max-width: 90%;
            max-height: 80vh;
            overflow: hidden;
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 14px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
        }

        .form-textarea {
            min-height: 150px;
            resize: vertical;
            font-family: 'Consolas', monospace;
        }

        .modal-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            border: 1px solid var(--border);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .btn-secondary {
            background: var(--item);
            color: var(--text);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 0;
            min-width: 150px;
            display: none;
            z-index: 200;
        }

        .context-menu.active {
            display: block;
        }

        .context-item {
            padding: 8px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-item:hover {
            background: var(--item-hover);
        }

        .context-item.danger {
            color: #f44336;
        }

        /* Drag ghost */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            padding: 6px 12px;
            background: var(--accent);
            color: white;
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <span>📁 Prompts</span>
            <div>
                <button onclick="createFolder()" title="New Folder">📁+</button>
                <button onclick="createPrompt()" title="New Prompt">📄+</button>
            </div>
        </div>
        <div class="folder-tree" id="folderTree"></div>
    </div>
    <div class="resizer" id="resizer"></div>

    <div class="main">
        <div class="toolbar">
            <button onclick="createPrompt()">📄 New Prompt</button>
            <button onclick="createFolder()">📁 New Folder</button>
            <button onclick="importData()">📥 Import Files</button>
            <button onclick="importFolder()">📂 Import Folder</button>
            <button onclick="exportData()">📤 Export</button>
            <button onclick="openSettings()">⚙️ Cài đặt</button>
        </div>
        <div class="content">
            <div class="prompt-view empty" id="promptView">
                <span>Chọn một prompt để xem</span>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">New Prompt</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <input type="hidden" id="editType">
                <div class="form-group">
                    <label class="form-label">Tên</label>
                    <input type="text" class="form-input" id="itemName" placeholder="Tên prompt hoặc folder">
                </div>
                <div class="form-group" id="contentGroup">
                    <label class="form-label">Nội dung Prompt</label>
                    <textarea class="form-textarea" id="itemContent"
                        placeholder="Paste prompt của bạn vào đây..."></textarea>
                </div>
                <div class="form-group" id="folderGroup">
                    <label class="form-label">Folder</label>
                    <select class="form-select" id="parentFolder"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                <button class="btn btn-primary" onclick="saveItem()">💾 Lưu</button>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <div class="context-item" onclick="editItem()">✏️ Đổi tên/Nội dung</div>
        <div class="context-item" onclick="moveToRoot()">⬆️ Chuyển ra Root</div>
        <div class="context-item" onclick="duplicateItem()">📋 Nhân bản</div>
        <div class="context-item danger" onclick="deleteItem()">🗑️ Xóa</div>
    </div>

    <!-- Trash Context Menu -->
    <div class="context-menu" id="trashContextMenu">
        <div class="context-item" onclick="restoreItem()">♻️ Khôi phục</div>
        <div class="context-item danger" onclick="permanentDelete()">❌ Xóa vĩnh viễn</div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Cài đặt Thùng rác</h3>
                <button class="modal-close" onclick="closeSettings()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Tự động xóa vĩnh viễn sau</label>
                    <select class="form-select" id="autoDeleteDays">
                        <option value="0">Không tự động xóa</option>
                        <option value="1">1 ngày</option>
                        <option value="3">3 ngày</option>
                        <option value="7">7 ngày</option>
                        <option value="30">30 ngày</option>
                    </select>
                </div>
                <div class="form-group">
                    <button class="btn btn-secondary" onclick="emptyTrash()" style="width:100%">🗑️ Dọn sạch thùng
                        rác</button>
                    <button class="btn btn-secondary" onclick="resetAllData()"
                        style="width:100%; margin-top: 10px; background-color: #dc3545; color: white; border-color: #dc3545;">⚠️
                        Xóa toàn bộ dữ liệu (Reset)</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveSettings()">💾 Lưu</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Import -->
    <input type="file" id="importFile" accept=".json, .txt, .docx" multiple style="display:none">
    <input type="file" id="importFolder" webkitdirectory directory multiple style="display:none">

    <script>
        const STORAGE_KEY = 'prompt_manager_v4';

        let data = {
            folders: [
                { id: 'root', name: 'Root', parent: null }
            ],
            prompts: [],
            trash: [],
            settings: { autoDeleteDays: 7 }
        };

        let selectedIds = new Set();
        let primarySelectedId = null;
        let lastClickedId = null; // For Shift+Click range
        let contextTarget = null;
        let dragItem = null;
        let isTrashView = false;
        let actionHistory = []; // History stack for Undo

        // Init
        const init = () => {
            loadData();
            cleanupTrash();
            cleanupOrphans(); // Remove invalid folders
            render();
            attachEvents();
        };

        const loadData = () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                data = JSON.parse(saved);
                if (!data.folders) data.folders = [{ id: 'root', name: 'Root', parent: null }];
                if (!data.prompts) data.prompts = [];
                if (!data.trash) data.trash = [];
                if (!data.trash) data.trash = [];
                if (!data.settings) data.settings = { autoDeleteDays: 7 };
                if (!data.sidebarWidth) data.sidebarWidth = 250; // Default width
                // History is not saved to localStorage, it's session-based
            }

            // Apply saved width
            if (data.sidebarWidth) {
                document.querySelector('.sidebar').style.width = data.sidebarWidth + 'px';
            }
        };

        const saveData = () => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            // Notify parent to sync
            window.parent.postMessage({ type: 'SYNC_DRIVE' }, '*');
        };

        // Render
        const render = () => {
            const tree = document.getElementById('folderTree');
            let html = renderFolder('root');

            // Add trash section
            const trashCount = data.trash.length;
            html += `
                <div style="border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px;">
                    <div class="folder-item ${isTrashView ? 'selected' : ''}" 
                         onclick="showTrash()"
                         ondragover="handleTrashDragOver(event)"
                         ondrop="handleTrashDrop(event)">
                        <span class="folder-toggle"></span>
                        <span class="folder-icon">🗑️</span>
                        <span class="folder-name">Thùng rác ${trashCount > 0 ? '(' + trashCount + ')' : ''}</span>
                    </div>
                </div>
            `;

            tree.innerHTML = html;
        };

        const renderFolder = (folderId, level = 0) => {
            const folder = data.folders.find(f => f.id === folderId);
            if (!folder) return '';

            const childFolders = data.folders.filter(f => f.parent === folderId);
            const childPrompts = data.prompts.filter(p => (p.folder || 'root') === folderId);
            const isCollapsed = folder.collapsed;
            const isRoot = folderId === 'root';

            let html = '';

            if (!isRoot) {
                const isSelected = selectedIds.has(folderId);
                html += `
                    <div class="folder-item ${isSelected ? 'selected' : ''}" 
                         data-id="${folderId}" 
                         data-type="folder"
                         title="${escapeHtml(folder.name)}"
                         draggable="true"
                         onclick="selectFolder('${folderId}', event)"
                         oncontextmenu="showContext(event, '${folderId}', 'folder')">
                        <span class="folder-toggle" onclick="event.stopPropagation(); toggleFolder('${folderId}')">${isCollapsed ? '▶' : '▼'}</span>
                        <span class="folder-icon">📁</span>
                        <span class="folder-name">${escapeHtml(folder.name)}</span>
                    </div>
                `;
            }

            const childrenClass = isCollapsed && !isRoot ? 'collapsed' : '';
            html += `<div class="folder-children ${childrenClass}" data-folder="${folderId}">`;

            childFolders.forEach(cf => {
                html += renderFolder(cf.id, level + 1);
            });

            childPrompts.forEach(p => {
                const isSelected = selectedIds.has(p.id);
                html += `
                    <div class="prompt-item ${isSelected ? 'selected' : ''}"
                         data-id="${p.id}"
                         data-type="prompt"
                         title="${escapeHtml(p.name)}"
                         draggable="true"
                         onclick="selectPrompt('${p.id}', event)"
                         oncontextmenu="showContext(event, '${p.id}', 'prompt')">
                        <span class="folder-toggle"></span>
                        <span class="prompt-icon">📄</span>
                        <span class="prompt-name">${escapeHtml(p.name)}</span>
                    </div>
                `;
            });

            html += '</div>';
            return html;
        };

        // Selection Logic
        const handleSelection = (id, type, event) => {
            if (event && (event.ctrlKey || event.metaKey)) {
                // Toggle
                if (selectedIds.has(id)) {
                    selectedIds.delete(id);
                    if (primarySelectedId === id) {
                        primarySelectedId = Array.from(selectedIds).pop() || null;
                    }
                } else {
                    selectedIds.add(id);
                    primarySelectedId = id;
                }
            } else if (event && event.shiftKey && lastClickedId) {
                // Range Selection (Simple implementation: Select everything between in current flatten view is hard in tree)
                // Fallback: Just add to selection for now, accurate range in tree is complex without linear index
                // Better approach: Get all visible items in tree order and select range
                const allVisible = getAllVisibleItems();
                const startIdx = allVisible.findIndex(item => item.id === lastClickedId);
                const endIdx = allVisible.findIndex(item => item.id === id);

                if (startIdx !== -1 && endIdx !== -1) {
                    const min = Math.min(startIdx, endIdx);
                    const max = Math.max(startIdx, endIdx);
                    // If not holding ctrl, clear others? Standard behavior is usually yes
                    if (!event.ctrlKey) selectedIds.clear();

                    for (let i = min; i <= max; i++) {
                        selectedIds.add(allVisible[i].id);
                    }
                    primarySelectedId = id;
                } else {
                    selectedIds.add(id);
                    primarySelectedId = id;
                }
            } else {
                // Single select
                selectedIds.clear();
                selectedIds.add(id);
                primarySelectedId = id;
            }

            lastClickedId = id;
            render(); // Re-render tree highlights

            // Render View Pane based on Primary Selection
            if (primarySelectedId) {
                if (type === 'folder') renderFolderView(primarySelectedId);
                else renderPromptView(primarySelectedId);
            } else {
                document.getElementById('promptView').innerHTML = '<span>Chọn một prompt để xem</span>';
                document.getElementById('promptView').classList.add('empty');
            }
        };

        const getAllVisibleItems = () => {
            // Helper to get linear list of currently visible items for Shift+Click
            // We can traverse the DOM or data. DOM is easier for visual order.
            const items = [];
            document.querySelectorAll('.folder-item, .prompt-item').forEach(el => {
                // Skip trash and root header if needed, but they usually aren't .folder-item in tree
                if (el.dataset.id) items.push({ id: el.dataset.id, type: el.dataset.type });
            });
            return items;
        };

        const selectFolder = (id, event) => {
            handleSelection(id, 'folder', event);
        };

        const renderFolderView = (id) => {
            const folder = data.folders.find(f => f.id === id);
            const childPrompts = data.prompts.filter(p => p.folder === id);

            let html = `
                <div class="prompt-title">
                    <span>📁 ${escapeHtml(folder?.name || 'Root')}</span>
                    <span style="font-size:13px;color:var(--text-muted);margin-left:auto;">${childPrompts.length} prompts</span>
                </div>
                <div style="display:flex;flex-direction:column;gap:24px;padding-bottom:100px;">
            `;

            if (childPrompts.length === 0) {
                html += '<div style="text-align:center;color:var(--text-muted);padding:20px;">Thư mục trống</div>';
            } else {
                childPrompts.forEach(p => {
                    html += `
                        <div class="prompt-content" style="position:relative; border:1px solid var(--border);" 
                             data-id="${p.id}"
                             data-type="prompt"
                             draggable="true"
                             ondragstart="handleGridDragStart(event)"
                        >
                            <div style="margin-bottom:12px; display:flex; align-items:center; gap:8px;">
                                <span style="font-size:16px;">📄</span>
                                <input type="text" class="form-input" id="name_${p.id}" 
                                       value="${escapeHtml(p.name)}" 
                                       placeholder="Tên prompt" 
                                       draggable="false"
                                       onmouseenter="disableDrag(this)"
                                       onmouseleave="enableDrag(this)"
                                       style="font-size:16px;font-weight:600;border:none;outline:none;box-shadow:none;background:transparent;padding:0;flex:1;"
                                       oninput="autoSavePrompt('${p.id}')">
                            </div>
                            <textarea class="form-textarea" id="content_${p.id}" 
                                      placeholder="Nội dung prompt..." 
                                      draggable="false"
                                      onmouseenter="disableDrag(this)"
                                      onmouseleave="enableDrag(this)"
                                      style="width:100%;min-height:100px;resize:none;background:transparent;border:none;outline:none;box-shadow:none;padding:0;line-height:1.6;font-family:inherit;overflow-y:hidden;"
                                      oninput="autoSavePrompt('${p.id}'); autoResize(this)">${escapeHtml(p.content)}</textarea>
                             <div style="color:var(--text-muted);font-size:11px;margin-top:8px;text-align:right;">
                                💾 Auto-save
                            </div>
                        </div>
                    `;
                });
            }

            html += '</div>';

            const view = document.getElementById('promptView');
            view.innerHTML = html;
            view.classList.remove('empty');

            // Auto resize all textareas
            childPrompts.forEach(p => {
                const el = document.getElementById(`content_${p.id}`);
                if (el) autoResize(el);
            });
        };

        const autoResize = (el) => {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        };

        // Hover Lock: Disable drag on parent when hovering input
        const disableDrag = (el) => {
            const card = el.closest('.prompt-content');
            if (card) card.setAttribute('draggable', 'false');
        };

        const enableDrag = (el) => {
            const card = el.closest('.prompt-content');
            if (card) card.setAttribute('draggable', 'true');
        };

        // Separate drag handler for grid items to avoid conflict
        const handleGridDragStart = (e) => {
            // CRITICAL: Ignore drag if touching inputs
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            e.dataTransfer.setData('text/plain', e.target.dataset.id);
            // Allow normal dragstart to bubble up or handle manually if needed
        };

        const selectPrompt = (id, event) => {
            handleSelection(id, 'prompt', event);
        };

        const renderPromptView = (id) => {
            isTrashView = false;
            // render(); // Already called in handleSelection
            const prompt = data.prompts.find(p => p.id === id);
            if (prompt) {
                document.getElementById('promptView').innerHTML = `
                    <div class="prompt-title" style="margin-bottom:12px;">
                        <input type="text" class="form-input" id="editName" value="${escapeHtml(prompt.name)}" 
                               placeholder="Tên prompt" style="font-size:16px;font-weight:600;"
                               oninput="autoSavePrompt('${id}')">
                    </div>
                    <textarea class="form-textarea" id="editContent" 
                              placeholder="Nội dung prompt..." 
                              style="width:100%;min-height:calc(100vh - 180px);resize:none;"
                              oninput="autoSavePrompt('${id}')">${escapeHtml(prompt.content)}</textarea>
                    <div style="color:var(--text-muted);font-size:11px;margin-top:8px;">
                        💾 Tự động lưu khi chỉnh sửa
                    </div>
                `;
                document.getElementById('promptView').classList.remove('empty');
            }
        };

        let saveTimeout = null;
        const autoSavePrompt = (id) => {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                const prompt = data.prompts.find(p => p.id === id);
                if (prompt) {
                    // Try to find specific inputs (Folder View)
                    const nameEl = document.getElementById(`name_${id}`);
                    const contentEl = document.getElementById(`content_${id}`);

                    // Fallback to Single View IDs
                    const nameVal = nameEl ? nameEl.value : (document.getElementById('editName')?.value);
                    const contentVal = contentEl ? contentEl.value : (document.getElementById('editContent')?.value);

                    let changed = false;
                    let nameChanged = false;

                    if (nameVal !== undefined && nameVal !== prompt.name) {
                        prompt.name = nameVal;
                        changed = true;
                        nameChanged = true;
                    }
                    if (contentVal !== undefined && contentVal !== prompt.content) {
                        prompt.content = contentVal;
                        changed = true;
                    }

                    if (changed || contentVal !== undefined) {
                        saveData();

                        // Smart update: Don't re-render everything to keep Undo history!
                        // Only update sidebar name if name changed
                        if (nameChanged) {
                            // Find sidebar item by data-id attribute to be safe
                            const sidebarItem = document.querySelector(`.prompt-item[data-id="${id}"] .prompt-name`);
                            if (sidebarItem) {
                                sidebarItem.textContent = nameVal;
                            }
                        }
                    }
                }
            }, 500);
        };

        const toggleFolder = (id) => {
            const folder = data.folders.find(f => f.id === id);
            if (folder) {
                folder.collapsed = !folder.collapsed;
                saveData();
                render();
            }
        };

        // CRUD
        const createFolder = () => {
            document.getElementById('modalTitle').textContent = 'New Folder';
            document.getElementById('editId').value = '';
            document.getElementById('editType').value = 'folder';
            document.getElementById('itemName').value = '';
            document.getElementById('contentGroup').style.display = 'none';
            populateFolderSelect();
            openModal();
        };

        const createPrompt = () => {
            document.getElementById('modalTitle').textContent = 'New Prompt';
            document.getElementById('editId').value = '';
            document.getElementById('editType').value = 'prompt';
            document.getElementById('itemName').value = '';
            document.getElementById('itemContent').value = '';
            document.getElementById('contentGroup').style.display = 'block';
            populateFolderSelect();
            openModal();
        };

        const editItem = () => {
            if (!contextTarget) return;
            const { id, type } = contextTarget;

            if (type === 'folder') {
                const folder = data.folders.find(f => f.id === id);
                if (!folder || id === 'root') return;
                document.getElementById('modalTitle').textContent = 'Edit Folder';
                document.getElementById('editId').value = id;
                document.getElementById('editType').value = 'folder';
                document.getElementById('itemName').value = folder.name;
                document.getElementById('contentGroup').style.display = 'none';
            } else {
                const prompt = data.prompts.find(p => p.id === id);
                if (!prompt) return;
                document.getElementById('modalTitle').textContent = 'Edit Prompt';
                document.getElementById('editId').value = id;
                document.getElementById('editType').value = 'prompt';
                document.getElementById('itemName').value = prompt.name;
                document.getElementById('itemContent').value = prompt.content;
                document.getElementById('contentGroup').style.display = 'block';
            }

            populateFolderSelect();
            openModal();
            hideContext();
        };

        const duplicateItem = () => {
            if (!contextTarget) return;
            const { id, type } = contextTarget;

            if (type === 'prompt') {
                const prompt = data.prompts.find(p => p.id === id);
                if (prompt) {
                    data.prompts.push({
                        id: 'p_' + Date.now(),
                        name: prompt.name + ' (copy)',
                        content: prompt.content,
                        folder: prompt.folder
                    });
                    saveData();
                    render();
                    showToast('Đã nhân bản!');
                }
            }
            hideContext();
        };

        const deleteItem = (targetId = null, targetType = null) => {
            let itemsToDelete = [];

            if (targetId && targetType) {
                // Direct delete (drag drop single, or context menu single)
                itemsToDelete.push({ id: targetId, type: targetType });
            } else if (contextTarget) {
                // Context menu
                // If context target is NOT in selection, we delete just context target
                // If it IS in selection, we specificially delete the context target? 
                // No, usually context menu on selection implies batch action.
                // But let's check if contextTarget.id is in selectedIds.
                if (selectedIds.has(contextTarget.id) && selectedIds.size > 1) {
                    // Batch delete
                    selectedIds.forEach(id => {
                        // Determine type for each selected id
                        const f = data.folders.find(x => x.id === id);
                        const p = data.prompts.find(x => x.id === id);
                        if (f) itemsToDelete.push({ id, type: 'folder' });
                        if (p) itemsToDelete.push({ id, type: 'prompt' });
                    });
                } else {
                    itemsToDelete.push({ id: contextTarget.id, type: contextTarget.type });
                }
                hideContext();
            } else {
                // Called via keyboard or toolbar?
                if (selectedIds.size > 0) {
                    selectedIds.forEach(id => {
                        const f = data.folders.find(x => x.id === id);
                        const p = data.prompts.find(x => x.id === id);
                        if (f) itemsToDelete.push({ id, type: 'folder' });
                        if (p) itemsToDelete.push({ id, type: 'prompt' });
                    });
                } else {
                    return;
                }
            }

            if (itemsToDelete.length === 0) return;

            const deletedItems = []; // For history tracking

            itemsToDelete.forEach(item => {
                const { id, type } = item;

                if (type === 'folder' && id !== 'root') {
                    const folder = data.folders.find(f => f.id === id);
                    if (folder) {
                        // Find all descendant folders recursively
                        const getDescendants = (parentId) => {
                            let descendants = [];
                            const children = data.folders.filter(f => f.parent === parentId);
                            children.forEach(child => {
                                descendants.push(child);
                                descendants = descendants.concat(getDescendants(child.id));
                            });
                            return descendants;
                        };

                        const allFoldersToDelete = [folder, ...getDescendants(id)];

                        allFoldersToDelete.forEach(f => {
                            // Archive prompts in this folder
                            data.prompts.filter(p => p.folder === f.id).forEach(p => {
                                deletedItems.push({ ...p, type: 'prompt' });
                                data.trash.push({ ...p, deletedAt: Date.now(), type: 'prompt' });
                            });

                            // Archive the folder itself
                            deletedItems.push({ ...f, type: 'folder' });
                            data.trash.push({ ...f, deletedAt: Date.now(), type: 'folder' });

                            // Remove from data
                            data.prompts = data.prompts.filter(p => p.folder !== f.id);
                            data.folders = data.folders.filter(x => x.id !== f.id);
                        });
                    }
                } else if (type === 'prompt') {
                    const prompt = data.prompts.find(p => p.id === id);
                    if (prompt) {
                        deletedItems.push({ ...prompt, type: 'prompt' });
                        data.trash.push({ ...prompt, deletedAt: Date.now(), type: 'prompt' });
                        data.prompts = data.prompts.filter(p => p.id !== id);
                    }
                }
            });

            if (deletedItems.length > 0) {
                // Push to history
                actionHistory.push({
                    type: 'BATCH_DELETE',
                    items: deletedItems, // Store copies of items
                    timestamp: Date.now()
                });

                selectedIds.clear();
                primarySelectedId = null;

                saveData();
                render();
                // Clear view pane if deleted
                const view = document.getElementById('promptView');
                view.innerHTML = '<span>Chọn một prompt để xem</span>';
                view.classList.add('empty');

                showToast('🗑️ Đã chuyển ' + deletedItems.length + ' mục vào thùng rác!');
            }
        };

        // Undo Logic
        const undoLastAction = () => {
            if (actionHistory.length === 0) {
                showToast('Không có gì để Undo');
                return;
            }

            const action = actionHistory.pop();

            if (action.type === 'BATCH_DELETE') {
                let restoredCount = 0;
                action.items.forEach(oldItem => {
                    // Find in trash (match by ID)
                    const trashIndex = data.trash.findIndex(t => t.id === oldItem.id);
                    if (trashIndex !== -1) {
                        data.trash.splice(trashIndex, 1);

                        if (oldItem.type === 'folder') {
                            // Verify parent exists, if not, move to root (safety)
                            const parentExists = data.folders.find(f => f.id === oldItem.parent);
                            const folderToRestore = {
                                id: oldItem.id,
                                name: oldItem.name,
                                parent: parentExists ? oldItem.parent : 'root',
                                collapsed: oldItem.collapsed
                            };
                            data.folders.push(folderToRestore);
                        } else {
                            const parentExists = data.folders.find(f => f.id === oldItem.folder);
                            const promptToRestore = {
                                id: oldItem.id,
                                name: oldItem.name,
                                content: oldItem.content,
                                folder: parentExists ? oldItem.folder : 'root'
                            };
                            data.prompts.push(promptToRestore);
                        }
                        restoredCount++;
                    }
                });

                if (restoredCount > 0) {
                    saveData();
                    render();
                    showToast('♻️ Đã hoàn tác xóa ' + restoredCount + ' mục!');
                } else {
                    showToast('⚠️ Không thể hoàn tác (Mục đã bị xóa vĩnh viễn?)');
                }
            }
        };

        // Drag to Trash handlers
        const handleTrashDragOver = (e) => {
            e.preventDefault(); // Allow drop
            e.currentTarget.classList.add('drag-over');
        };

        const handleTrashDrop = (e) => {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const id = e.dataTransfer.getData('text/plain');

            // Check if dragged item is part of selection
            if (id && selectedIds.has(id)) {
                // Batch delete
                deleteItem(); // Calls deleteItem with no args, which triggers batch delete logic
            } else {
                // Single delete
                let type = 'prompt';
                if (data.folders.find(f => f.id === id)) {
                    type = 'folder';
                } else if (data.prompts.find(p => p.id === id)) {
                    type = 'prompt';
                } else {
                    return; // Unknown ID
                }
                deleteItem(id, type);
            }
        };

        // Trash functions
        const showTrash = () => {
            isTrashView = true;
            selectedIds.clear();
            primarySelectedId = 'trash';
            render();

            const view = document.getElementById('promptView');
            if (data.trash.length === 0) {
                view.innerHTML = '<span>🗑️ Thùng rác trống</span>';
                view.classList.add('empty');
            } else {
                view.innerHTML = `
                    <div class="prompt-title">
                        <span>🗑️ Thùng rác (${data.trash.length} items)</span>
                        <button class="copy-btn" onclick="emptyTrash()" style="background:#dc3545">🗑️ Dọn sạch</button>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:8px;">
                        ${data.trash.map(item => {
                    const daysAgo = Math.floor((Date.now() - item.deletedAt) / (1000 * 60 * 60 * 24));
                    return `
                                <div class="prompt-content" style="padding:12px;cursor:pointer;" 
                                     oncontextmenu="showTrashContext(event, '${item.id}')">
                                    <div style="display:flex;justify-content:space-between;align-items:center;">
                                        <span>${item.type === 'folder' ? '📁' : '📄'} ${escapeHtml(item.name)}</span>
                                        <span style="color:var(--text-muted);font-size:11px;">${daysAgo === 0 ? 'Hôm nay' : daysAgo + ' ngày trước'}</span>
                                    </div>
                                </div>
                            `;
                }).join('')}
                    </div>
                `;
                view.classList.remove('empty');
            }
        };

        const showTrashContext = (e, id) => {
            e.preventDefault();
            e.stopPropagation();
            contextTarget = { id, type: 'trash' };
            const menu = document.getElementById('trashContextMenu');
            menu.style.left = e.pageX + 'px';
            menu.style.top = e.pageY + 'px';
            menu.classList.add('active');
        };

        const restoreItem = () => {
            if (!contextTarget) return;
            const { id } = contextTarget;
            hideTrashContext();

            const item = data.trash.find(t => t.id === id);
            if (item) {
                if (item.type === 'folder') {
                    data.folders.push({ id: item.id, name: item.name, parent: 'root' });
                } else {
                    data.prompts.push({ id: item.id, name: item.name, content: item.content, folder: 'root' });
                }
                data.trash = data.trash.filter(t => t.id !== id);
                saveData();
                render();
                showTrash();
                showToast('♻️ Đã khôi phục!');
            }
        };

        const permanentDelete = () => {
            if (!contextTarget) return;
            const { id } = contextTarget;
            hideTrashContext();

            data.trash = data.trash.filter(t => t.id !== id);
            saveData();
            render();
            showTrash();
            showToast('❌ Đã xóa vĩnh viễn!');
        };

        const emptyTrash = () => {
            data.trash = [];
            saveData();
            render();
            showTrash();
            showToast('🗑️ Đã dọn sạch thùng rác!');
        };

        const resetAllData = () => {
            if (confirm('⚠️ CẢNH BÁO: Hành động này sẽ xóa TOÀN BỘ prompts, folders và settings của bạn.\n\nDữ liệu sẽ trở về trạng thái ban đầu (trống rỗng).\n\nBạn có chắc chắn muốn tiếp tục?')) {
                // Reset to default
                data = {
                    folders: [
                        { id: 'root', name: 'Root', parent: null }
                    ],
                    prompts: [],
                    trash: [],
                    settings: { autoDeleteDays: 7 },
                    sidebarWidth: 250
                };
                saveData();
                render();
                closeSettings();
                showToast('✅ Đã reset toàn bộ dữ liệu!');
            }
        };

        const hideTrashContext = () => {
            document.getElementById('trashContextMenu').classList.remove('active');
        };

        const cleanupTrash = () => {
            if (data.settings.autoDeleteDays === 0) return;
            const cutoff = Date.now() - (data.settings.autoDeleteDays * 24 * 60 * 60 * 1000);
            const before = data.trash.length;
            data.trash = data.trash.filter(t => t.deletedAt > cutoff);
            if (data.trash.length < before) {
                saveData();
                showToast('🗑️ Đã tự động xóa ' + (before - data.trash.length) + ' items cũ');
            }
        };

        const cleanupOrphans = () => {
            // Remove folders that have non-existent parents (orphans)
            // Iterate until no more changes to handle multi-level orphans
            let changed = false;
            let currentFolderCount = data.folders.length;

            do {
                currentFolderCount = data.folders.length;
                data.folders = data.folders.filter(f => {
                    if (f.id === 'root') return true;
                    // Check if parent exists
                    return data.folders.some(p => p.id === f.parent);
                });
                if (data.folders.length < currentFolderCount) changed = true;
            } while (data.folders.length < currentFolderCount);

            // Fix prompts with invalid folders
            data.prompts.forEach(p => {
                if (p.folder !== 'root' && !data.folders.some(f => f.id === p.folder)) {
                    p.folder = 'root'; // Move to root
                    changed = true;
                }
            });

            if (changed) {
                console.log('Cleaned up orphan folders/prompts');
                saveData();
            }
        };

        // Settings
        const openSettings = () => {
            document.getElementById('autoDeleteDays').value = data.settings.autoDeleteDays;
            document.getElementById('settingsModal').classList.add('active');
        };

        const closeSettings = () => {
            document.getElementById('settingsModal').classList.remove('active');
        };

        const saveSettings = () => {
            data.settings.autoDeleteDays = parseInt(document.getElementById('autoDeleteDays').value);
            saveData();
            closeSettings();
            showToast('⚙️ Đã lưu cài đặt!');
        };

        const saveItem = () => {
            const id = document.getElementById('editId').value;
            const type = document.getElementById('editType').value;
            const name = document.getElementById('itemName').value.trim();
            const content = document.getElementById('itemContent').value;
            const parentId = document.getElementById('parentFolder').value;

            if (!name) {
                showToast('Cần nhập tên!');
                return;
            }

            if (type === 'folder') {
                if (id) {
                    const folder = data.folders.find(f => f.id === id);
                    if (folder) {
                        folder.name = name;
                        folder.parent = parentId;
                    }
                } else {
                    data.folders.push({
                        id: 'f_' + Date.now(),
                        name,
                        parent: parentId
                    });
                }
            } else {
                if (id) {
                    const prompt = data.prompts.find(p => p.id === id);
                    if (prompt) {
                        prompt.name = name;
                        prompt.content = content;
                        prompt.folder = parentId;
                    }
                } else {
                    data.prompts.push({
                        id: 'p_' + Date.now(),
                        name,
                        content,
                        folder: parentId
                    });
                }
            }

            saveData();
            render();
            closeModal();
            showToast('Đã lưu!');
        };

        const populateFolderSelect = () => {
            const select = document.getElementById('parentFolder');
            select.innerHTML = '<option value="root">📁 Root</option>';
            data.folders.filter(f => f.id !== 'root').forEach(f => {
                select.innerHTML += `<option value="${f.id}">📁 ${escapeHtml(f.name)}</option>`;
            });
        };

        // Copy
        const copyPrompt = (id) => {
            const prompt = data.prompts.find(p => p.id === id);
            if (prompt) {
                navigator.clipboard.writeText(prompt.content);
                showToast('✅ Đã copy!');
            }
        };

        // Import/Export
        const exportData = () => {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `prompts_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            showToast('📤 Đã export!');
        };

        const importData = () => document.getElementById('importFile').click();
        const importFolder = () => document.getElementById('importFolder').click();

        // Helper: Process a single file content
        const processImportedFileContent = (fileName, content, targetFolderId) => {
            if (fileName.endsWith('.json')) {
                try {
                    const imported = JSON.parse(content);
                    // Handle old format
                    if (imported.prompts && Array.isArray(imported.prompts)) {
                        imported.prompts.forEach(p => {
                            data.prompts.push({
                                id: 'p_' + Date.now() + Math.random(),
                                name: p.name,
                                content: p.content || '',
                                folder: targetFolderId || 'root'
                            });
                        });
                    } else if (Array.isArray(imported)) {
                        imported.forEach(p => {
                            data.prompts.push({
                                id: 'p_' + Date.now() + Math.random(),
                                name: p.name,
                                content: p.content,
                                folder: targetFolderId || 'root'
                            });
                        });
                    }
                } catch (e) {
                    console.error('JSON parse error', e);
                    showToast('⚠️ Lỗi file JSON: ' + fileName);
                }
            } else {
                // Text/Docx treated as one prompt
                data.prompts.push({
                    id: 'p_' + Date.now() + Math.random(),
                    name: fileName.replace(/\.[^/.]+$/, ""), // Remove extension
                    content: content,
                    folder: targetFolderId || 'root'
                });
            }
        };

        // File Import Handler
        document.getElementById('importFile').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            // Files always go to current selection if it's a folder, or root
            let targetId = 'root';
            if (primarySelectedId) {
                const item = data.folders.find(f => f.id === primarySelectedId);
                if (item) targetId = item.id;
            }

            await processFiles(files, targetId);
            finishImport();
        });

        // Folder Import Handler
        document.getElementById('importFolder').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            await processFiles(files, 'root', true); // True = use structure
            finishImport();
        });

        // Common Processor
        const processFiles = async (files, defaultTargetId, usePathStructure = false) => {
            showToast('⏳ Đang xử lý ' + files.length + ' file...');

            for (const file of files) {
                // Skip hidden files
                if (file.name.startsWith('.')) continue;

                let targetFolderId = defaultTargetId;

                // 1. Determine Target Folder
                if (usePathStructure && file.webkitRelativePath) {
                    // Path ex: "MyFolder/Sub/File.txt"
                    const parts = file.webkitRelativePath.split('/');
                    parts.pop(); // Remove filename

                    if (parts.length > 0) {
                        // Recursively resolve/create path starting from defaultTargetId (usually root)
                        let currentParentId = defaultTargetId;

                        for (const folderName of parts) {
                            // Find existing child with this name
                            let existing = data.folders.find(f => f.parent === currentParentId && f.name === folderName);
                            if (!existing) {
                                // Create new
                                existing = {
                                    id: 'f_' + Date.now() + Math.random(),
                                    name: folderName,
                                    parent: currentParentId,
                                    collapsed: false
                                };
                                data.folders.push(existing);
                            }
                            currentParentId = existing.id;
                        }
                        targetFolderId = currentParentId;
                    }
                }

                // 2. Read Content
                try {
                    let content = '';
                    if (file.name.endsWith('.docx')) {
                        const arrayBuffer = await file.arrayBuffer();
                        const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                        content = result.value;
                    } else {
                        content = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (ev) => resolve(ev.target.result);
                            reader.readAsText(file);
                        });
                    }

                    // 3. Process
                    processImportedFileContent(file.name, content, targetFolderId);

                } catch (err) {
                    console.error("Error reading file", file.name, err);
                }
            }
        };

        const finishImport = () => {
            saveData();
            render(); // Refresh UI
            document.getElementById('importFile').value = '';
            document.getElementById('importFolder').value = '';
            showToast('✅ Đã import thành công!');
        };


        // Drag & Drop
        const attachEvents = () => {
            document.addEventListener('dragstart', (e) => {
                // Prevent drag if target is input or textarea (allow text selection)
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    // e.preventDefault(); // Don't prevent default, just don't start our custom drag logic
                    // Actually, to select text, we often want normal behavior. 
                    // But if parent is draggable, browser might drag parent.
                    // We must STOP the drag attribute effect or stop propagation if possible if browser supports it.
                    // Simple hack: if it's text selection, we return and don't set dragItem
                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }

                if (e.target.dataset.id) {
                    dragItem = { id: e.target.dataset.id, type: e.target.dataset.type };

                    // If not selected, select it (unless ctrl pressed, but drag starts selection usually)
                    // Simplified: If dragging something NOT in selection, update selection to just this
                    if (!selectedIds.has(dragItem.id)) {
                        handleSelection(dragItem.id, dragItem.type, { ctrlKey: false, shiftKey: false });
                    }

                    e.dataTransfer.setData('text/plain', dragItem.id);
                    e.dataTransfer.effectAllowed = 'move';

                    // Custom ghost if multiple
                    if (selectedIds.size > 1) {
                        const ghost = document.createElement('div');
                        ghost.classList.add('drag-ghost');
                        ghost.textContent = `Moving ${selectedIds.size} items...`;
                        document.body.appendChild(ghost);
                        e.dataTransfer.setDragImage(ghost, 0, 0);
                        setTimeout(() => document.body.removeChild(ghost), 0);
                    }

                    e.target.style.opacity = '0.5';
                }
            });

            // Global Key Listener for Ctrl+Z
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    // Ignore if focusing input/textarea (browser handles text undo)
                    if (document.activeElement.tagName === 'INPUT' ||
                        document.activeElement.tagName === 'TEXTAREA') {
                        return;
                    }
                    e.preventDefault();
                    undoLastAction();
                }
            });

            // Init
            document.addEventListener('DOMContentLoaded', init);

            // Resizer Logic
            const resizer = document.getElementById('resizer');
            const sidebar = document.querySelector('.sidebar');
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                resizer.classList.add('resizing');
                document.body.style.cursor = 'col-resize';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const newWidth = e.clientX;
                if (newWidth > 150 && newWidth < 600) { // Min/Max limits
                    sidebar.style.width = newWidth + 'px';
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    resizer.classList.remove('resizing');
                    document.body.style.cursor = 'default';
                    // Save width
                    data.sidebarWidth = parseInt(sidebar.style.width);
                    saveData();
                }
            });
            document.addEventListener('dragend', (e) => {
                if (e.target.dataset.id) {
                    e.target.style.opacity = '1';
                    dragItem = null;
                    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                }
            });

            document.addEventListener('dragover', (e) => {
                e.preventDefault();
                // Explicitly check for Sidebar Header
                if (e.target.closest('.sidebar-header')) {
                    e.target.closest('.sidebar-header').style.background = 'var(--item-selected)';
                } else {
                    document.querySelector('.sidebar-header').style.background = '';
                }

                const target = e.target.closest('.folder-item, .folder-children');
                if (target) {
                    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                    target.classList.add('drag-over');
                }
            });

            document.addEventListener('dragleave', (e) => {
                if (e.target.closest('.sidebar-header')) {
                    document.querySelector('.sidebar-header').style.background = '';
                }
            });

            document.addEventListener('drop', (e) => {
                e.preventDefault();
                document.querySelector('.sidebar-header').style.background = '';

                if (!dragItem) return;

                // 1. Check for DROP on Sidebar Header (Explicit Root)
                if (e.target.closest('.sidebar-header')) {
                    handleMoveToRoot();
                    return;
                }

                // 2. Fallback: Sidebar background drop (if confusing, this at least covers 'empty space')
                const isSidebarBg = e.target.classList.contains('sidebar') || e.target.id === 'folderTree';
                if (isSidebarBg && !e.target.closest('.folder-item')) {
                    handleMoveToRoot();
                    return;
                }

                const target = e.target.closest('.folder-item, .folder-children, .prompt-item');
                // Allow dropping on folder-children (empty space in folder) or items

                if (!target) return;

                // REORDER LOGIC
                // Check if dropping onto an item of the SAME type to reorder
                const targetId = target.dataset.id;
                const targetType = target.dataset.type;

                if (targetId && targetType === dragItem.type && targetId !== dragItem.id) {
                    // Reorder Prompts (Folders should fall through to Move logic for nesting)
                    if (dragItem.type !== 'folder') {
                        // We need to find the array and swap/move
                        let array = data.prompts;
                        // Find indices
                        const fromIndex = array.findIndex(x => x.id === dragItem.id);
                        const toIndex = array.findIndex(x => x.id === targetId);

                        if (fromIndex > -1 && toIndex > -1) {
                            // Remove from old pos
                            const [movedItem] = array.splice(fromIndex, 1);
                            // Insert at new pos
                            array.splice(toIndex, 0, movedItem);

                            saveData();
                            render();
                            // If we are in folder view and reordered prompts, refresh folder view
                            if (primarySelectedId && dragItem.type === 'prompt') {
                                const p = array.find(x => x.id === dragItem.id);
                                if (p && p.folder === primarySelectedId) renderFolderView(primarySelectedId);
                            }
                            showToast('Đã sắp xếp!');
                            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                            return; // Done
                        }
                    }
                }

                // MOVE TO FOLDER LOGIC
                let targetFolderId = target.dataset.folder || target.dataset.id;

                // If target is a Prompt, move to its parent folder
                if (targetType === 'prompt') {
                    const targetPrompt = data.prompts.find(p => p.id === targetId);
                    if (targetPrompt) targetFolderId = targetPrompt.folder;
                }

                // If dropping directly on a FOLDER item -> that folder is the target
                if (targetType === 'folder') {
                    targetFolderId = targetId;
                }

                if (!targetFolderId) return;

                // Logic to move item to folder
                if (dragItem.type === 'prompt') {
                    const prompt = data.prompts.find(p => p.id === dragItem.id);
                    if (prompt && prompt.folder !== targetFolderId) {
                        prompt.folder = targetFolderId;
                        saveData();
                        render();
                        render();
                        if (primarySelectedId === targetFolderId) renderFolderView(primarySelectedId);
                        showToast('Đã di chuyển!');
                    }
                } else if (dragItem.type === 'folder' && dragItem.id !== targetFolderId) {
                    const folder = data.folders.find(f => f.id === dragItem.id);
                    // Prevent circular move
                    if (folder && folder.id !== 'root' && targetFolderId !== folder.id) {
                        // Check if target is a child of source (circular)
                        if (!isChildOf(targetFolderId, folder.id)) {
                            folder.parent = targetFolderId;
                            saveData();
                            render();
                            showToast('Đã di chuyển!');
                        }
                    }
                }

                document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            });

            // Helper for circular check
            const isChildOf = (childId, parentId) => {
                let curr = data.folders.find(f => f.id === childId);
                while (curr && curr.parent) {
                    if (curr.parent === parentId) return true;
                    curr = data.folders.find(f => f.id === curr.parent);
                }
                return false;
            };

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.context-menu')) {
                    hideContext();
                    hideTrashContext();
                }
            });
        };

        // Context Menu
        const showContext = (e, id, type) => {
            e.preventDefault();
            e.stopPropagation();
            contextTarget = { id, type };
            const menu = document.getElementById('contextMenu');
            menu.style.left = e.pageX + 'px';
            menu.style.top = e.pageY + 'px';
            menu.classList.add('active');
        };

        const hideContext = () => {
            document.getElementById('contextMenu').classList.remove('active');
        };

        // Modal
        const openModal = () => document.getElementById('modal').classList.add('active');
        const closeModal = () => document.getElementById('modal').classList.remove('active');

        // Utils
        const escapeHtml = (text) => {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        };

        const handleMoveToRoot = () => {
            if (dragItem.type === 'prompt') {
                const p = data.prompts.find(x => x.id === dragItem.id);
                if (p && p.folder !== 'root') {
                    p.folder = 'root';
                    saveData();
                    render();
                    showToast('Đã chuyển ra Root!');
                }
            } else if (dragItem.type === 'folder') {
                const f = data.folders.find(x => x.id === dragItem.id);
                if (f && f.parent !== 'root') {
                    f.parent = 'root';
                    saveData();
                    render();
                    showToast('Đã chuyển ra Root!');
                }
            }
        };

        const moveToRoot = () => {
            if (!contextTarget) return;
            dragItem = { ...contextTarget }; // Mock dragItem for reuse
            handleMoveToRoot();
            hideContext();
        };

        const showToast = (msg) => {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        };

        init();
    </script>
</body>

</html>
